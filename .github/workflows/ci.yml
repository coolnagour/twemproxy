name: CI

# Build and memory-safety-test the proxy on every push and pull request.
# Runs on both amd64 and arm64 hosted runners: arm64 also proves the repacked
# vendored libyaml tarball (contrib/yaml-0.1.4.tar.gz, with 2021 aarch64-aware
# config.guess/config.sub) autoreconfs and builds cleanly on real aarch64.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool

      # contrib/Makefile.am declares `SUBDIRS = yaml-0.1.4`, so automake (run by
      # autoreconf) needs that directory to exist. The tarball was repacked at
      # source with aarch64-aware config.guess/config.sub, so no script swap is
      # needed -- just extract it.
      - name: Extract vendored libyaml
        run: tar xzf contrib/yaml-0.1.4.tar.gz -C contrib

      - name: autoreconf
        run: autoreconf -fvi

      - name: configure
        run: ./configure

      - name: build
        run: make -j"$(nproc)"

      # ASan + UBSan gate. `make check` builds the project, then runs the C unit
      # harness (tests/unit/run.sh) via check-local. The harness's deliberate
      # bug-reproduction tests exit non-zero on purpose and the harness counts
      # that as PASS, so a fully-correct run makes `make check` exit 0. CI keys
      # on that final exit code.
      - name: make check (ASan + UBSan)
        run: make check CC=gcc CFLAGS="-fsanitize=address,undefined -g" LDFLAGS="-fsanitize=address,undefined"
